<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tonight · baby</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Outfit, system-ui, sans-serif; background: #1a0f2e; color: #efe6f8; }
    header { text-align: center; padding: 2.2rem 1.2rem .4rem; color: #fff; }
    h1 { font-family: "Playfair Display", serif; font-size: clamp(2rem, 5vw, 2.8rem); }
    .sub { color: #d8c8ee; margin-top: .4rem; }
    nav { display: flex; justify-content: center; gap: .55rem; flex-wrap: wrap; padding: 1rem; }
    nav a { color: #fff; text-decoration: none; border: 1px solid rgba(255,255,255,.25); padding: .5rem .95rem; border-radius: 999px; font-size: .88rem; }
    nav a.active, nav a:hover { background: #6b3fa0; border-color: #6b3fa0; }
    .wrap { max-width: 1080px; margin: 0 auto 3rem; padding: 0 1rem; }
    .status { text-align: center; color: #c9a7eb; font-size: .9rem; margin-bottom: .85rem; }
    .stage {
      background: #000; border-radius: 20px; overflow: hidden;
      border: 1px solid rgba(201,167,235,.3); aspect-ratio: 16/9;
    }
    #yt { width: 100%; height: 100%; border: 0; display: block; }
    .faces {
      display: flex; gap: .7rem; justify-content: center; flex-wrap: wrap;
      margin: .9rem 0 1.1rem;
    }
    .tile {
      width: min(220px, 46vw);
      background: #2a1848;
      border: 2px solid #c9a7eb;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0,0,0,.3);
    }
    .tile video { width: 100%; aspect-ratio: 3/4; object-fit: cover; background: #140a22; display: block; }
    .tile p { text-align: center; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; padding: .35rem; color: #e8d6ff; }
    .join {
      display: inline-block; margin: 0 .3rem 1rem;
      background: #6b3fa0; color: #fff; border: 0;
      border-radius: 999px; padding: .7rem 1.4rem;
      font: inherit; cursor: pointer;
    }
    .btns { text-align: center; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
    h2 { font-size: .82rem; letter-spacing: .14em; text-transform: uppercase; color: #c9a7eb; margin-bottom: .55rem; }
    button.song {
      text-align: left; width: 100%; margin-bottom: .45rem;
      background: rgba(255,255,255,.06); border: 1px solid rgba(201,167,235,.2);
      color: #fff; border-radius: 14px; padding: .7rem .85rem; cursor: pointer;
      font-family: inherit;
    }
    button.song:hover, button.song.on { background: #6b3fa0; border-color: #6b3fa0; }
    .meta { font-size: .75rem; color: #d8c8ee; }
    .chatbox {
      background: #2a1848; border: 1px solid rgba(201,167,235,.3);
      border-radius: 18px; display: flex; flex-direction: column; min-height: 360px;
    }
    #log { flex: 1; overflow-y: auto; padding: .85rem; max-height: 420px; font-size: .95rem; line-height: 1.5; }
    #log p { margin-bottom: .55rem; }
    #log .me { color: #e8d6ff; }
    #log .them { color: #fff; }
    #log .sys { color: #9b86b8; font-size: .8rem; }
    .send { display: flex; gap: .4rem; padding: .65rem; border-top: 1px solid rgba(201,167,235,.2); }
    .send input {
      flex: 1; border: 0; border-radius: 999px; padding: .6rem .9rem;
      background: #1a0f2e; color: #fff; font: inherit;
    }
    .send button {
      border: 0; border-radius: 999px; padding: .6rem 1rem;
      background: #6b3fa0; color: #fff; font: inherit; cursor: pointer;
    }
    .sig { font-family: "Playfair Display", serif; font-style: italic; color: #c9a7eb; text-align: center; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <header>
    <h1>Tonight</h1>
    <p class="sub">no time limit · camera · talk · text · songs</p>
  </header>
  <nav>
    <a href="index.html">The card</a>
    <a href="playlist.html">BTS playlist</a>
    <a class="active" href="watch.html">Tonight</a>
  </nav>
  <div class="wrap">
    <p class="status" id="status">tap join tonight — allow camera & mic once</p>
    <div class="btns">
      <button class="join" id="join" type="button">join tonight</button>
    </div>

    <div class="stage"><div id="yt"></div></div>

    <div class="faces">
      <div class="tile">
        <video id="local" autoplay muted playsinline></video>
        <p>me</p>
      </div>
      <div class="tile">
        <video id="remote" autoplay playsinline></video>
        <p>you 💜</p>
      </div>
    </div>

    <div class="cols">
      <div>
        <h2>songs</h2>
        <div id="list"></div>
      </div>
      <div>
        <h2>chat</h2>
        <div class="chatbox">
          <div id="log"></div>
          <form class="send" id="form">
            <input id="msg" maxlength="400" placeholder="type to me…" autocomplete="off" />
            <button type="submit">send</button>
          </form>
        </div>
      </div>
    </div>
    <p class="sig">I’ll be there · I purple you</p>
  </div>

  <script src="songs.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    var ROOM = "baby-purple-borahae-room";
    var ICE = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" },
        { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
        { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" },
        { urls: "turn:openrelay.metered.ca:443?transport=tcp", username: "openrelayproject", credential: "openrelayproject" }
      ]
    };
    var player, ytReady = false, currentId = BTS_SONGS[0].id;
    var conns = [];
    var applying = false;
    var localStream = null;
    var myPeer = null;
    var role = null;
    var joined = false;

    function setStatus(t) { document.getElementById("status").textContent = t; }

    function log(html, cls) {
      var p = document.createElement("p");
      p.className = cls || "sys";
      p.innerHTML = html;
      var box = document.getElementById("log");
      box.appendChild(p);
      box.scrollTop = box.scrollHeight;
    }

    function highlight(id) {
      document.querySelectorAll(".song").forEach(function (x) {
        x.classList.toggle("on", x.dataset.id === id);
      });
    }

    function send(msg) {
      conns.forEach(function (c) { if (c.open) try { c.send(msg); } catch (e) {} });
    }

    function playId(id, auto, broadcast) {
      currentId = id;
      highlight(id);
      if (ytReady) {
        if (auto) player.loadVideoById(id);
        else player.cueVideoById(id);
      }
      if (broadcast) send({ type: "video", id: id });
    }

    function onMsg(msg) {
      if (!msg || !msg.type) return;
      if (msg.type === "ping") { send({ type: "pong" }); return; }
      if (msg.type === "pong") return;
      if (msg.type === "chat") {
        log("<b>you</b> · " + escapeHtml(msg.text), "them");
        return;
      }
      applying = true;
      if (msg.type === "video") playId(msg.id, true, false);
      if (msg.type === "state" && ytReady) {
        if (Math.abs((player.getCurrentTime() || 0) - msg.t) > 2) player.seekTo(msg.t, true);
        if (msg.p === 1) player.playVideo();
        if (msg.p === 2) player.pauseVideo();
      }
      setTimeout(function () { applying = false; }, 400);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
      });
    }

    function attachRemote(stream) {
      var v = document.getElementById("remote");
      v.srcObject = stream;
      v.play().catch(function () {});
    }

    function hookConn(c) {
      if (conns.indexOf(c) === -1) conns.push(c);
      c.on("data", onMsg);
      c.on("close", function () {
        conns = conns.filter(function (x) { return x !== c; });
        setStatus(conns.length ? "we’re both here 💜" : "reconnecting… tap join if it stays dark");
      });
      c.on("error", function () {});
      setStatus("we’re both here 💜 talk, type, play songs");
      log("you’re here 💜");
      send({ type: "video", id: currentId });
    }

    function startCall(id) {
      if (!localStream || !myPeer) return;
      var call = myPeer.call(id, localStream);
      if (!call) return;
      call.on("stream", attachRemote);
      call.on("close", function () { setTimeout(function () { startCall(id); }, 1500); });
    }

    function listenCalls() {
      myPeer.on("call", function (call) {
        call.answer(localStream);
        call.on("stream", attachRemote);
      });
    }

    function keepAlive() {
      setInterval(function () {
        send({ type: "ping", t: Date.now() });
        if (myPeer && myPeer.disconnected) {
          try { myPeer.reconnect(); } catch (e) {}
        }
      }, 8000);
    }

    function peerOpts(id) {
      var o = { config: ICE, debug: 0 };
      return id ? new Peer(id, o) : new Peer(o);
    }

    function asGuest() {
      role = "guest";
      myPeer = peerOpts();
      listenCalls();
      myPeer.on("open", function () {
        var c = myPeer.connect(ROOM, { reliable: true });
        c.on("open", function () {
          hookConn(c);
          startCall(ROOM);
        });
      });
      myPeer.on("disconnected", function () { try { myPeer.reconnect(); } catch (e) {} });
      myPeer.on("error", function () {
        setStatus("still here — tap join tonight again if her face disappears");
      });
    }

    function asHost() {
      role = "host";
      myPeer = peerOpts(ROOM);
      listenCalls();
      myPeer.on("open", function () {
        setStatus("you’re in · waiting for them…");
        log("room is open — no 5 minute cut");
      });
      myPeer.on("connection", function (c) {
        hookConn(c);
        startCall(c.peer);
      });
      myPeer.on("disconnected", function () { try { myPeer.reconnect(); } catch (e) {} });
      myPeer.on("error", function (err) {
        if (err.type === "unavailable-id") asGuest();
      });
    }

    async function join() {
      joined = true;
      setStatus("allow camera & mic when the browser asks…");
      try {
        if (!localStream) {
          localStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" },
            audio: true
          });
          var lv = document.getElementById("local");
          lv.srcObject = localStream;
          lv.play().catch(function () {});
        }
      } catch (e) {
        setStatus("tap Allow on camera & mic, then join again");
        log("camera/mic not allowed yet");
        return;
      }

      if (typeof Peer === "undefined") {
        setStatus("camera is on · reload if her face doesn’t show");
        return;
      }

      try { if (myPeer) myPeer.destroy(); } catch (e) {}
      conns = [];
      asHost();
    }

    document.getElementById("join").onclick = join;
    keepAlive();

    document.getElementById("form").onsubmit = function (e) {
      e.preventDefault();
      var input = document.getElementById("msg");
      var text = input.value.trim();
      if (!text) return;
      log("<b>me</b> · " + escapeHtml(text), "me");
      send({ type: "chat", text: text });
      input.value = "";
    };

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("yt", {
        videoId: currentId,
        playerVars: { rel: 0, modestbranding: 1, playsinline: 1, origin: location.origin },
        events: {
          onReady: function () { ytReady = true; },
          onStateChange: function (e) {
            if (applying) return;
            if (e.data === 1 || e.data === 2) {
              send({ type: "state", p: e.data, t: player.getCurrentTime() || 0 });
            }
            if (e.data === 0) {
              var i = BTS_SONGS.findIndex(function (s) { return s.id === currentId; });
              playId(BTS_SONGS[(i + 1) % BTS_SONGS.length].id, true, true);
            }
          }
        }
      });
    }

    BTS_SONGS.forEach(function (s, i) {
      var b = document.createElement("button");
      b.className = "song" + (i === 0 ? " on" : "");
      b.dataset.id = s.id;
      b.innerHTML = "<strong>" + s.t + "</strong><br><span class='meta'>" + s.n + "</span>";
      b.onclick = function () { playId(s.id, true, true); };
      document.getElementById("list").appendChild(b);
    });
    highlight(currentId);
    log("Jitsi is gone. This call stays on our page.");
  </script>

</html>
